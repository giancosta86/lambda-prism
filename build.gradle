buildscript {
    repositories {
        //TODO! Del this!
        mavenLocal()

        mavenCentral()
    }

    dependencies {
        classpath 'info.gianlucacosta.aurora:aurora:10.0.0-SNAPSHOT'
        classpath 'com.github.maiflai:gradle-scalatest:0.12'
    }
}


apply plugin: 'scala'
apply plugin: 'antlr'
apply plugin: 'maven'
apply plugin: 'osgi'
apply plugin: 'com.github.maiflai.scalatest'
apply plugin: 'info.gianlucacosta.aurora'


group = 'info.gianlucacosta.lambdaprism'
archivesBaseName = 'lambdaprism'
version = '4.0.0-SNAPSHOT'

description = 'Scala OOP-FP pragmatic library for Artificial Intelligence'


dependencies {
    compile 'org.scala-lang:scala-library:2.11.8'
    compile 'org.antlr:antlr4-runtime:4.5.3'

    compile 'info.gianlucacosta.omnieditor:omnieditor:6.0.0-SNAPSHOT'

    testCompile 'org.scalatest:scalatest_2.11:2.2.6'
    testRuntime 'org.pegdown:pegdown:1.6.0'

    antlr 'org.antlr:antlr4:4.5.3'
}


aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }
}


generateGrammarSource {
    outputDirectory = project.file("${project.buildDir}/generated/java/info/gianlucacosta/lambdaprism/planning/problem/parser")
    arguments += [
            '-visitor',
            '-long-messages',
            '-no-listener',
            '-Werror'
    ]
}

compileScala.dependsOn("generateGrammarSource")
